<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex">

  <!-- Left Sidebar -->
  <div class="w-[20%] bg-gray-900 p-4 flex flex-col justify-between border-r border-gray-700">
    <div>
      <h1 class="text-2xl font-bold mb-4 text-blue-400">Gemini Chat</h1>
      <ul class="space-y-2">
        <li><a href="#" class="text-gray-300 hover:text-white">New Chat</a></li>
        <li><a href="#" class="text-gray-300 hover:text-white">History</a></li>
        <li><a href="#" class="text-gray-300 hover:text-white">Settings</a></li>
      </ul>
    </div>
    <div>
      <p class="text-sm text-gray-500">&copy; 2025 Gemini Chat UI</p>
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="w-[70%] mx-auto flex flex-col justify-between">
    <!-- Chat Box -->
    <div class="flex-1 overflow-y-auto p-6 space-y-4" id="chat-box">
      <!-- Messages will appear here -->
    </div>

    <!-- Input Area -->
    <div class="p-4 border-t border-gray-700 bg-gray-950 flex items-center gap-2">
      <input id="user-input" type="text" placeholder="Ask something..." class="flex-1 px-4 py-2 bg-gray-800 text-white rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-full hover:bg-blue-700">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      const message = inputField.value.trim();
      if (!message) return;

      // Append user message
      const userMsg = document.createElement("div");
      userMsg.className = "text-right";
      userMsg.innerHTML = `<div class="inline-block bg-blue-600 text-white px-4 py-2 rounded-2xl">${message}</div>`;
      chatBox.appendChild(userMsg);
      inputField.value = "";

      // Fetch bot response
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await res.json();

      // Append bot response
      const botMsg = document.createElement("div");
      botMsg.className = "text-left";
      botMsg.innerHTML = `<div class="inline-block bg-gray-800 text-white px-4 py-2 rounded-2xl">${data.response}</div>`;
      chatBox.appendChild(botMsg);

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
